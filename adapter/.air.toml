#:schema https://json.schemastore.org/any.json

env_files = [".env"]
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  # bin 名带 bbclaw-adapter,这样 `make clean-run-procs` 的进程匹配能识别并清理。
  bin = "./tmp/bbclaw-adapter"
  # 默认 build(bare `air`)。make run 会用注入版本号 ldflags 的 --build.cmd 覆盖。
  cmd = "go build -o ./tmp/bbclaw-adapter ./cmd/bbclaw-adapter"
  delay = 500
  entrypoint = ["./tmp/bbclaw-adapter"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  # 重启前给老进程 2s 优雅退出(释放端口 / 关 WS 连接),避免端口还被占着。
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  # 用 SIGINT 重启 → 走 adapter 的优雅关闭(等价 Ctrl+C)。
  send_interrupt = true
  # 编译失败时保留上一个能跑的进程,别把活着的 adapter 换成崩的。
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
