<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>bbclaw adapter v2 · 配置</title>
  <!--
    Loopback-only web admin/config page for adapter_v2 (ADR-025 web-first config +
    ADR-036 project loader). ONE static HTML file: inline <style> + vanilla JS, NO
    build step — embeds cleanly alongside index.html so `go build` stays toolchain-free.

    Layout (VSCode-settings style):
      · left section nav (two groups: 即时生效 / 系统配置)
      · right scrollable sections
      · a CONTEXTUAL save bar pinned to the bottom of the settings area (not a global
        top button) — appears only when there are unsaved system-config changes.

    Two distinct save models, deliberately separated:
      · 即时生效 (项目): each control commits immediately via its OWN button
        (POST/DELETE /v1/projects, POST /v1/admin/pick-dir). No save bar.
      · 系统配置: edit fields → 保存 (PUT /v1/settings) → 重启并应用
        (POST /v1/settings/restart → poll /healthz → reload).
  -->
  <style>
    /* dot-matrix / Nothing-style tokens (design/UI_DESIGN_LANGUAGE.md) */
    :root{
      --bg:#070b0e; --lit:#dfeaec; --ghost:#152128; --dim:#6e8a93;
      --accent:#2ec4a0; --ok:#4cd964; --err:#e66f6f; --pitch:9px; --hdrh:56px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:var(--lit); background:var(--bg);
      background-image:radial-gradient(var(--ghost) 1px, transparent 1px);
      background-size:var(--pitch) var(--pitch);
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent);text-decoration:none}

    /* header */
    .hdr{padding:14px 22px;border-bottom:1px solid var(--ghost);display:flex;align-items:center;gap:14px;
      background:rgba(7,11,14,.92);backdrop-filter:blur(3px);position:sticky;top:0;z-index:5;flex-wrap:wrap;min-height:var(--hdrh)}
    .wordmark{font-weight:700;font-size:15px;letter-spacing:.42em;color:var(--lit);
      border-bottom:2px dotted var(--accent);padding-bottom:3px}
    .wordmark:hover{color:var(--accent)}
    .hdr .sub{font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
    .tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
    .tab{font:inherit;cursor:pointer;background:transparent;border:1px solid var(--ghost);color:var(--dim);
      border-radius:7px;padding:6px 12px;font-size:12px}
    .tab:hover{color:var(--lit);border-color:var(--dim)}
    .tab.on{color:#04110f;background:var(--accent);border-color:var(--accent);font-weight:600}

    /* layout: sidebar + content */
    .layout{display:flex;align-items:flex-start;gap:0;max-width:1180px;margin:0 auto}
    .sidebar{position:sticky;top:var(--hdrh);align-self:flex-start;flex:0 0 196px;width:196px;
      max-height:calc(100vh - var(--hdrh));overflow:auto;padding:20px 12px 40px}
    .navgroup{margin-bottom:18px}
    .navlabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
      margin:0 8px 8px;display:flex;align-items:center;gap:8px}
    .navlabel::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
    .navgroup.immediate .navlabel::before{background:var(--ok)}
    .navitem{display:block;font:inherit;font-size:12px;color:var(--dim);padding:6px 10px;border-radius:6px;
      cursor:pointer;border-left:2px solid transparent;letter-spacing:.02em}
    .navitem:hover{color:var(--lit);background:rgba(255,255,255,.025)}
    .navitem.on{color:var(--lit);background:rgba(46,196,160,.1);border-left-color:var(--accent)}
    .navgroup.immediate .navitem.on{background:rgba(76,217,100,.1);border-left-color:var(--ok)}

    .content{flex:1;min-width:0;padding:20px 24px 120px}

    /* sections + cards */
    .sec{scroll-margin-top:calc(var(--hdrh) + 14px);margin-bottom:22px}
    .grouphdr{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
      margin:6px 2px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .grouphdr.imm{color:var(--ok)}
    .grouphdr.ro{color:var(--dim)}
    .grouphdr .gh-note{color:var(--dim);text-transform:none;letter-spacing:.02em;font-size:10px}
    .navgroup.readonly .navlabel::before{background:var(--dim)}
    .navgroup.readonly .navitem.on{background:rgba(110,138,147,.12);border-left-color:var(--dim)}
    /* user-profile / memory files (read-only) */
    .memfile{margin-bottom:14px}
    .memfile:last-child{margin-bottom:0}
    .memname{font-size:11px;color:var(--accent);letter-spacing:.04em;margin-bottom:5px}
    .mempre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.5;color:var(--lit);
      background:#05090c;border:1px solid var(--ghost);border-radius:7px;padding:10px 12px;max-height:280px;overflow:auto}
    .card{background:rgba(13,18,22,.78);border:1px solid var(--ghost);border-radius:10px;padding:16px 18px}
    .card>h2{font-size:12px;letter-spacing:.04em;color:var(--lit);margin:0 0 4px;font-weight:600}
    .card>.cardsub{font-size:11px;color:var(--dim);margin:0 0 14px}

    /* settings fields (label · description · input, stacked like VSCode) */
    .setting{margin-bottom:15px}
    .setting:last-child{margin-bottom:2px}
    .setting .slabel{font-size:11px;color:var(--lit);letter-spacing:.02em;margin-bottom:2px}
    .setting .slabel .env{color:var(--dim);font-size:10px;margin-left:6px}
    .setting .sdesc{font-size:10.5px;color:var(--dim);margin-bottom:6px;line-height:1.45}
    .setting input[type=text],.setting input[type=password],.setting textarea{width:100%;
      font:inherit;background:#05090c;color:var(--lit);border:1px solid var(--ghost);border-radius:7px;
      padding:8px 10px;font-size:12px}
    .setting input:focus,.setting textarea:focus{outline:none;border-color:var(--accent)}
    .setting textarea{min-height:60px;resize:vertical}
    .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
    .switch input{accent-color:var(--accent);width:15px;height:15px}
    .switch .swl{font-size:11px;color:var(--lit)}

    /* status / read-only grid */
    .status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
    .status-grid .item{border:1px solid var(--ghost);border-radius:7px;padding:9px 11px;background:rgba(7,11,14,.5)}
    .status-grid .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
    .status-grid .v{font-size:12px;color:var(--lit);word-break:break-all}

    /* buttons */
    button{font:inherit;cursor:pointer;border-radius:7px;padding:8px 16px;border:1px solid var(--accent);
      background:var(--accent);color:#04110f;font-weight:600;letter-spacing:.03em;font-size:12px}
    button:disabled{opacity:.45;cursor:default}
    button.ghost{background:transparent;color:var(--dim);border-color:var(--ghost);font-weight:400}
    button.ghost:hover:not(:disabled){color:var(--lit);border-color:var(--dim)}

    /* projects */
    .projlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .projrow{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--ghost);border-radius:7px;
      padding:9px 11px;background:rgba(7,11,14,.5)}
    .projrow .pinfo{flex:1;min-width:0}
    .projrow .ptop{font-size:12px;color:var(--lit);word-break:break-word}
    .projrow .hint{font-size:10px;color:var(--dim);word-break:break-all;margin-top:2px}
    .pbadge{font-size:10px;letter-spacing:.04em;border-radius:5px;padding:1px 7px;margin-left:6px;
      border:1px solid var(--ghost);white-space:nowrap}
    .pbadge.ok{color:var(--ok);border-color:#1f4d47}
    .pbadge.warn{color:var(--err);border-color:#3a2422}
    .pdel{background:transparent;color:var(--dim);border-color:var(--ghost);padding:4px 11px;font-weight:400;font-size:11px}
    .pdel:hover{color:var(--err);border-color:#3a2422}
    .addrow{border-top:1px dotted var(--ghost);padding-top:13px}
    #np-pick{font-weight:400;background:transparent;color:var(--lit);border-color:var(--dim)}
    #np-pick:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    /* device control rows */
    .dcrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    #dc-vol{width:110px;font:inherit;background:#05090c;color:var(--lit);border:1px solid var(--ghost);
      border-radius:7px;padding:8px 10px;font-size:12px}
    #dc-vol:focus{outline:none;border-color:var(--accent)}

    /* contextual save bar (lives with the settings, pinned to the bottom) */
    .savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:14px;
      padding:12px 24px;border-top:1px solid var(--ghost);background:rgba(7,11,14,.96);backdrop-filter:blur(4px)}
    .savebar .sb-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
    .savebar.pending .sb-dot{background:var(--err)}
    .savebar .sb-msg{flex:1;min-width:160px;font-size:12px;color:var(--lit)}
    .savebar .sb-msg b{color:var(--accent)}

    /* toast */
    .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:9;
      background:#05090c;border:1px solid var(--ghost);border-radius:8px;padding:9px 16px;font-size:12px;
      color:var(--lit);box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none}
    .toast.show{opacity:1}
    .toast.ok{border-color:#1f4d47;color:var(--ok)}
    .toast.err{border-color:#3a2422;color:var(--err)}

    .loading,.error{padding:40px 0;text-align:center;color:var(--dim)}
    .error{color:var(--err)}
    .hide{display:none}

    /* narrow screens: stack the nav above the content */
    @media (max-width:760px){
      .layout{flex-direction:column}
      .sidebar{position:static;width:auto;flex:none;max-height:none;display:flex;gap:14px;overflow-x:auto;
        padding:12px 16px;border-bottom:1px solid var(--ghost)}
      .navgroup{margin-bottom:0;display:flex;align-items:center;gap:6px}
      .navlabel{margin:0 4px 0 0}
      .navitem{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
      .navitem.on{border-left:none;border-bottom-color:var(--accent)}
      .content{padding:16px 16px 120px}
    }
  </style>
</head>
<body>
  <header class="hdr">
    <a class="wordmark" href="/" title="回到首页 Home">BBCLAW</a>
    <span class="sub">adapter_v2</span>
    <nav class="tabs">
      <a class="tab" href="/#terminal">终端 Terminal</a>
      <a class="tab" href="/#sessions">会话 Sessions</a>
      <a class="tab on" href="/admin">⚙ 管理 Admin</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="nav"></aside>
    <main class="content" id="content"><div class="loading">加载中…</div></main>
  </div>

  <div class="savebar hide" id="savebar">
    <span class="sb-dot"></span>
    <span class="sb-msg" id="sb-msg"></span>
    <button id="sb-save">保存</button>
    <button id="sb-restart" class="ghost hide">重启并应用</button>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  (function () {
    "use strict";
    const $ = (id) => document.getElementById(id);
    let current = null;       // last-loaded {settings, derived, restartRequired}
    let dirty = false;        // unsaved system-config edits since load/save
    let restartPending = false;

    function toast(msg, kind) {
      const t = $("toast");
      t.textContent = msg;
      t.className = "toast show" + (kind ? " " + kind : "");
      setTimeout(() => { t.className = "toast"; }, 2600);
    }
    function esc(s) { return String(s == null ? "" : s); }
    function escA(s) { return esc(s).replace(/"/g, "&quot;"); }

    // ── settings field builders (label · description · input) ──────────────────
    function inputField(env, label, path, value, opts) {
      opts = opts || {};
      const type = opts.password ? "password" : "text";
      const desc = opts.desc ? `<div class="sdesc">${esc(opts.desc)}</div>` : "";
      const ph = opts.placeholder ? ` placeholder="${escA(opts.placeholder)}"` : "";
      return `<div class="setting"><div class="slabel">${esc(label)}<span class="env">${esc(env)}</span></div>
        ${desc}<input type="${type}" data-path="${path}" value="${escA(value)}"${ph} autocomplete="off" spellcheck="false" /></div>`;
    }
    function areaField(env, label, path, value, desc) {
      return `<div class="setting"><div class="slabel">${esc(label)}<span class="env">${esc(env)}</span></div>
        ${desc ? `<div class="sdesc">${esc(desc)}</div>` : ""}
        <textarea data-path="${path}" spellcheck="false">${esc(value)}</textarea></div>`;
    }
    function boolField(label, path, value, desc) {
      return `<div class="setting"><label class="switch">
        <input type="checkbox" data-path="${path}" data-bool="1" ${value ? "checked" : ""} />
        <span class="swl">${esc(label)}</span></label>
        ${desc ? `<div class="sdesc" style="margin-top:5px">${esc(desc)}</div>` : ""}</div>`;
    }
    function card(id, title, sub, body) {
      return `<section class="sec" id="${id}"><div class="card">
        <h2>${esc(title)}</h2>${sub ? `<div class="cardsub">${esc(sub)}</div>` : ""}${body}</div></section>`;
    }

    // ── section model: one entry per settings card (drives nav + content) ──────
    const SECTIONS = [
      {id:"sec-asr", nav:"语音 · ASR", build:(s)=>{const a=(s.voice||{}).asr||{};return card("sec-asr","语音 · ASR（识别）","把用户语音转成文字的服务",
        inputField("ASR_PROVIDER","Provider","voice.asr.provider",a.provider,{desc:"local / openai_compatible / doubao_native（留空用内置模拟）"})+
        inputField("ASR_LANGUAGE","语言","voice.asr.language",a.language)+
        inputField("ASR_BASE_URL","Base URL","voice.asr.baseUrl",a.baseUrl)+
        inputField("ASR_API_KEY","API Key","voice.asr.apiKey",a.apiKey,{password:true})+
        inputField("ASR_MODEL","模型","voice.asr.model",a.model)+
        inputField("ASR_APP_ID","App ID","voice.asr.appId",a.appId)+
        inputField("ASR_RESOURCE_ID","Resource ID","voice.asr.resourceId",a.resourceId)+
        inputField("ASR_HOTWORDS","热词","voice.asr.hotwords",a.hotwords,{desc:"逗号/空格分隔；已登记的项目名会自动并入"})+
        inputField("ASR_LOCAL_BIN","Local Bin","voice.asr.localBin",a.localBin)+
        inputField("ASR_LOCAL_ARGS","Local Args","voice.asr.localArgs",a.localArgs)+
        inputField("ASR_LOCAL_TEXT_PATH","Local Text Path","voice.asr.localTextPath",a.localTextPath));}},
      {id:"sec-tts", nav:"语音 · TTS", build:(s)=>{const t=(s.voice||{}).tts||{};return card("sec-tts","语音 · TTS（合成）","把回复文字读出来的服务",
        inputField("TTS_PROVIDER","Provider","voice.tts.provider",t.provider,{desc:"local / doubao_native（留空用内置 say/silent）"})+
        inputField("TTS_VOICE","音色","voice.tts.voice",t.voice)+
        inputField("TTS_BASE_URL","Base URL","voice.tts.baseUrl",t.baseUrl)+
        inputField("TTS_APP_ID","App ID","voice.tts.appId",t.appId)+
        inputField("TTS_TOKEN","Token","voice.tts.token",t.token,{password:true})+
        inputField("TTS_CLUSTER","Cluster","voice.tts.cluster",t.cluster)+
        inputField("TTS_LOCAL_BIN","Local Bin","voice.tts.localBin",t.localBin)+
        inputField("TTS_LOCAL_ARGS","Local Args","voice.tts.localArgs",t.localArgs)+
        inputField("TTS_LOCAL_OUTPUT_FORMAT","Local Output Format","voice.tts.localOutputFormat",t.localOutputFormat));}},
      {id:"sec-device", nav:"设备线", build:(s)=>{const d=s.device||{};return card("sec-device","设备线（bbwire/2）","设备语音串流行为",
        boolField("流式回复增量","device.streamDelta",d.streamDelta,"STREAM_DELTA · 边出边显，reply.end 为准")+
        boolField("分段 TTS","device.segmentTts",d.segmentTts,"SEGMENT_TTS · 逐句合成播放"));}},
      {id:"sec-cli", nav:"CLI / 管家", build:(s)=>{const c=s.cli||{};return card("sec-cli","CLI / 管家","跑哪个 CLI、监听地址、权限与人设",
        inputField("ADAPTER_V2_CLI","CLI argv","cli.cli",c.cli,{desc:"空格分隔，如 claude"})+
        inputField("ADAPTER_V2_ADDR","监听地址","cli.addr",c.addr,{desc:"如 :18090"})+
        inputField("ADAPTER_V2_CWD","工作目录","cli.cwd",c.cwd,{desc:"留空用共享 butler workspace"})+
        boolField("跳过权限确认","cli.skipPermissions",c.skipPermissions,"SKIP_PERMISSIONS · 语音设备无法应答权限弹窗")+
        boolField("自动跳过 claude 首启提示","cli.claudeAutoEnter",c.claudeAutoEnter,"CLAUDE_AUTO_ENTER")+
        boolField("设备端确认权限弹窗","cli.confirmOnDevice",c.confirmOnDevice,"CONFIRM_ON_DEVICE · 关 bypass，弹窗转发设备（ADR-033）")+
        areaField("ADAPTER_V2_VOICE_SYSTEM_PROMPT","设备人设（覆盖）","cli.voiceSystemPrompt",c.voiceSystemPrompt,"留空用默认人设；填了会整体覆盖"));}},
      {id:"sec-ai", nav:"Claude 端点", build:(s)=>{const ai=s.ai||{};return card("sec-ai","Claude 端点（三方 / 代理）","走第三方 / 兼容端点时才填；留空用 claude 官方登录态",
        inputField("ANTHROPIC_BASE_URL","Base URL","ai.anthropicBaseUrl",ai.anthropicBaseUrl,{placeholder:"https://your-proxy.example.com"})+
        inputField("ANTHROPIC_AUTH_TOKEN","Auth Token","ai.anthropicAuthToken",ai.anthropicAuthToken,{password:true,placeholder:"sk-..."}));}},
      {id:"sec-cloud", nav:"云", build:(s)=>{const cl=s.cloud||{};return card("sec-cloud","云（Cloud Relay）","连云后远程设备可经云端中继接到本机",
        inputField("CLOUD_WS_URL","WS URL","cloud.wsUrl",cl.wsUrl,{desc:"留空则不连云，仅 LAN"})+
        inputField("CLOUD_AUTH_TOKEN","Auth Token","cloud.authToken",cl.authToken,{password:true})+
        inputField("HOME_SITE_ID","Home Site ID","cloud.homeSiteId",cl.homeSiteId,{desc:"留空用持久化身份 identity.json"}));}},
      {id:"sec-memory", nav:"用户画像 / 记忆", group:"read", build:()=>card("sec-memory","用户画像 / 记忆",
        "管家在 workspace/MEMORY/ 里积累的关于你的记忆（只读；管家在对话中自行读写）",
        `<div id="memory"><div class="loading">加载记忆…</div></div>`)},
      {id:"sec-status", nav:"状态 / 只读", group:"read", build:(s,d)=>card("sec-status","状态 / 只读","系统生成，不可编辑",
        `<div class="status-grid">
          <div class="item"><div class="k">version</div><div class="v">${esc(d.version)}</div></div>
          <div class="item"><div class="k">home site id</div><div class="v">${esc(d.homeSiteId)}</div></div>
          <div class="item"><div class="k">workspace</div><div class="v">${esc(d.workspace)}</div></div>
          <div class="item"><div class="k">settings file</div><div class="v">${esc(d.settingsFile)}</div></div>
        </div>`)},
    ];

    // ── render the whole page (nav + sections) ─────────────────────────────────
    function render(data) {
      const s = data.settings || {}, d = data.derived || {};
      const cfg = SECTIONS.filter((x)=>x.group !== "read");
      const read = SECTIONS.filter((x)=>x.group === "read");
      const navItems = (arr)=>arr.map((x)=>`<a class="navitem" data-target="${x.id}">${esc(x.nav)}</a>`).join("");

      $("nav").innerHTML =
        `<div class="navgroup immediate"><div class="navlabel">即时生效</div>
           <a class="navitem" data-target="sec-projects">项目</a>
           <a class="navitem" data-target="sec-devicectl">设备控制</a></div>
         <div class="navgroup"><div class="navlabel">系统配置 · 需保存</div>${navItems(cfg)}</div>
         <div class="navgroup readonly"><div class="navlabel">只读信息</div>${navItems(read)}</div>`;

      $("content").innerHTML =
        `<div class="grouphdr imm">即时生效 · 无需保存
           <span class="gh-note">各控件用自己的按钮即时写入，不走「保存」</span></div>
         <section class="sec" id="sec-projects"><div id="projects"><div class="loading">加载项目…</div></div></section>
         <section class="sec" id="sec-devicectl"><div id="devicectl"><div class="loading">加载设备控制…</div></div></section>
         <div class="grouphdr">系统配置 · 需保存
           <span class="gh-note">改完底部点「保存」，再「重启并应用」才生效</span></div>
         ${cfg.map((x)=>x.build(s, d)).join("")}
         <div class="grouphdr ro">只读信息
           <span class="gh-note">管家的记忆与系统状态，仅查看</span></div>
         ${read.map((x)=>x.build(s, d)).join("")}`;

      dirty = false;
      restartPending = !!data.restartRequired;
      updateSaveBar();
      setupScrollSpy();
      loadProjects();
      loadDeviceControl();
      loadMemory();
    }

    // ── system-config save model (PUT the whole doc) ───────────────────────────
    function setPath(obj, path, value) {
      const parts = path.split(".");
      let o = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        if (o[parts[i]] == null || typeof o[parts[i]] !== "object") o[parts[i]] = {};
        o = o[parts[i]];
      }
      o[parts[parts.length - 1]] = value;
    }
    function collect() {
      const doc = JSON.parse(JSON.stringify(current.settings || {}));
      document.querySelectorAll("[data-path]").forEach((el) => {
        const value = el.getAttribute("data-bool") ? !!el.checked : el.value;
        setPath(doc, el.getAttribute("data-path"), value);
      });
      return doc;
    }
    function updateSaveBar() {
      const bar = $("savebar");
      if (!dirty && !restartPending) { bar.classList.add("hide"); return; }
      bar.classList.remove("hide");
      bar.classList.toggle("pending", restartPending && !dirty);
      $("sb-save").disabled = !dirty;
      $("sb-save").classList.toggle("hide", !dirty);
      $("sb-restart").classList.toggle("hide", !restartPending);
      $("sb-msg").innerHTML = dirty
        ? "有<b>未保存</b>的系统配置更改"
        : "已保存 · 重启适配器后生效";
    }
    function markDirty() { if (!dirty) { dirty = true; updateSaveBar(); } }

    async function save() {
      const doc = collect();
      $("sb-save").disabled = true;
      try {
        const r = await fetch("/v1/settings", {
          method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(doc),
        });
        const j = await r.json();
        if (!r.ok || !j.ok) throw new Error((j && j.detail) || ("HTTP " + r.status));
        current.settings = doc;
        dirty = false; restartPending = true;
        updateSaveBar();
        toast("已保存", "ok");
      } catch (e) {
        toast("保存失败：" + e.message, "err");
        $("sb-save").disabled = false;
      }
    }
    async function pollHealth(then) {
      for (let i = 0; i < 60; i++) {
        try { const r = await fetch("/healthz", {cache: "no-store"}); if (r.ok) { then(); return; } }
        catch (e) { /* still restarting */ }
        await new Promise((res) => setTimeout(res, 500));
      }
      toast("重启超时，请手动刷新", "err");
    }
    async function restart() {
      $("sb-restart").disabled = true;
      $("sb-restart").textContent = "重启中…";
      try { await fetch("/v1/settings/restart", {method: "POST"}); } catch (e) { /* conn drops on re-exec */ }
      setTimeout(() => pollHealth(() => location.reload()), 800);
    }

    // ── scrollspy: highlight the nav item of the section in view ───────────────
    let spy = null;
    function setupScrollSpy() {
      if (spy) spy.disconnect();
      const secs = [...document.querySelectorAll(".sec")];
      spy = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          document.querySelectorAll(".navitem").forEach((n) =>
            n.classList.toggle("on", n.getAttribute("data-target") === en.target.id));
        });
      }, {rootMargin: `-${56 + 20}px 0px -55% 0px`, threshold: 0});
      secs.forEach((s) => spy.observe(s));
    }
    $("nav").addEventListener("click", (ev) => {
      const a = ev.target.closest(".navitem"); if (!a) return;
      ev.preventDefault();
      const t = document.getElementById(a.getAttribute("data-target"));
      if (t) t.scrollIntoView({behavior: "smooth", block: "start"});
    });

    // mark the system-config form dirty on any [data-path] edit (project inputs
    // have no data-path, so they never trip the settings save bar).
    $("content").addEventListener("input", (ev) => {
      if (ev.target.hasAttribute && ev.target.hasAttribute("data-path")) markDirty();
    });
    $("content").addEventListener("change", (ev) => {
      if (ev.target.hasAttribute && ev.target.hasAttribute("data-path")) markDirty();
    });
    $("sb-save").addEventListener("click", save);
    $("sb-restart").addEventListener("click", restart);

    // ── projects (即时生效, ADR-036) — own buttons, never touches the save bar ──
    function projectRow(p) {
      let badge = "";
      if (p.cliBin) {
        const ok = p.cliReady;
        badge = `<span class="pbadge ${ok ? "ok" : "warn"}">CLI: ${esc(p.cliBin)} ${ok ? "就绪" : "未配置"}</span>`;
      }
      const sum = p.summary ? ` — ${esc(p.summary)}` : "";
      return `<div class="projrow"><div class="pinfo"><div class="ptop"><b>${esc(p.name)}</b>${sum} ${badge}</div>
        <div class="hint">${esc(p.path)}</div></div>
        <button class="pdel" data-del="${escA(p.name)}">删除</button></div>`;
    }
    function renderProjects(list) {
      const rows = (list && list.length)
        ? list.map(projectRow).join("")
        : `<div class="sdesc">还没有登记项目。点下面选个目录，管家就知道你在做什么。</div>`;
      $("projects").innerHTML = `<div class="card">
        <h2>项目 Projects</h2><div class="cardsub">让管家开口即知你在做哪些项目；选个目录即时加入（无需「保存」）</div>
        <div class="projlist">${rows}</div>
        <div class="addrow"><button id="np-pick" type="button">+ 添加项目目录…</button></div></div>`;
    }
    async function loadProjects() {
      try {
        const r = await fetch("/v1/projects", {headers: {Accept: "application/json"}});
        const j = await r.json();
        if (!r.ok || !j.ok) throw new Error((j && j.detail) || ("HTTP " + r.status));
        renderProjects((j.data && j.data.projects) || []);
      } catch (e) {
        $("projects").innerHTML = `<div class="error">加载项目失败：${esc(e.message)}</div>`;
      }
    }
    async function addByPath(path) {
      // Name auto-derives from the directory base name server-side; no extra form.
      const r = await fetch("/v1/projects", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({path})});
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error((j && j.detail) || ("HTTP " + r.status));
      const name = (j.data && j.data.project && j.data.project.name) || "项目";
      toast("已添加 " + name + "（下次重启后管家生效）", "ok");
      await loadProjects();
    }
    async function deleteProject(name) {
      try {
        const r = await fetch("/v1/projects/" + encodeURIComponent(name), {method: "DELETE"});
        const j = await r.json();
        if (!r.ok || !j.ok) throw new Error((j && j.detail) || ("HTTP " + r.status));
        toast("已删除（下次重启后生效）", "ok");
        await loadProjects();
      } catch (e) { toast("删除失败：" + e.message, "err"); }
    }
    // One step: pick a folder in the host's native dialog → it's added immediately
    // (no name/summary/CLI form). If no native picker, fall back to pasting a path.
    async function pickAndAdd() {
      const btn = $("np-pick");
      btn.disabled = true; btn.textContent = "选择中…";
      try {
        const r = await fetch("/v1/admin/pick-dir", {method: "POST"});
        const j = await r.json();
        if (!j.ok) {
          const typed = prompt("粘贴项目目录的绝对路径");
          if (typed && typed.trim()) await addByPath(typed.trim());
          return;
        }
        if (j.data && j.data.path) await addByPath(j.data.path); // cancelled → nothing
      } catch (e) {
        toast("添加失败：" + e.message, "err");
      } finally {
        const b = $("np-pick"); if (b) { b.disabled = false; b.textContent = "+ 添加项目目录…"; }
      }
    }
    $("content").addEventListener("click", (ev) => {
      const t = ev.target.closest("button"); if (!t) return;
      if (t.id === "np-pick") return pickAndAdd();
      if (t.hasAttribute("data-del")) return deleteProject(t.getAttribute("data-del"));
    });

    // ── device control (密语 / 音量) for the current device, via cloud config ──
    // Controls the connected device the SAME way the butler does over voice
    // (POST /v1/admin/device-config → cloud → firmware). Immediate, no save.
    function renderDeviceControl(deviceId, cloudReady) {
      const dev = deviceId ? `当前设备 <b style="color:var(--lit)">${esc(deviceId)}</b>` : "当前无设备连接";
      const warn = (!deviceId || !cloudReady)
        ? `<div class="sdesc" style="color:var(--err)">${!cloudReady ? "未配对云端（需 cloud_saas）" : ""}${(!cloudReady&&!deviceId)?"、":""}${!deviceId ? "无设备连接" : ""}——控制暂不可用。</div>`
        : "";
      $("devicectl").innerHTML = `<div class="card">
        <h2>设备控制 Device</h2>
        <div class="cardsub">作用于当前连接的设备，经云端即时下发（和管家用语音调的是同一条路）。${dev}</div>
        ${warn}
        <div class="setting">
          <div class="slabel">密语模式 <span class="env">miyu</span></div>
          <div class="sdesc">锁屏后用语音解锁；开 / 关即时下发到设备</div>
          <div class="dcrow"><button data-miyu="on">开密语</button><button class="ghost" data-miyu="off">关密语</button></div>
        </div>
        <div class="setting">
          <div class="slabel">音量 <span class="env">volume</span></div>
          <div class="dcrow"><input id="dc-vol" type="number" min="0" max="100" placeholder="0-100" />
            <button id="dc-vol-set">设置音量</button></div>
        </div></div>`;
    }
    async function loadDeviceControl() {
      const host = $("devicectl"); if (!host) return;
      try {
        const r = await fetch("/v1/admin/device-config", {headers:{Accept:"application/json"}});
        const j = await r.json();
        if (!r.ok || !j.ok) throw new Error((j&&j.detail)||("HTTP "+r.status));
        renderDeviceControl((j.data&&j.data.deviceId)||"", !!(j.data&&j.data.cloudReady));
      } catch (e) { host.innerHTML = `<div class="error">加载设备控制失败：${esc(e.message)}</div>`; }
    }
    async function deviceConfig(body, okMsg) {
      try {
        const r = await fetch("/v1/admin/device-config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
        const j = await r.json();
        if (!j.ok) { toast(j.detail || j.error || "操作失败", "err"); return; }
        toast(okMsg(j.data || {}), "ok");
      } catch (e) { toast("操作失败：" + e.message, "err"); }
    }
    $("content").addEventListener("click", (ev) => {
      const t = ev.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-miyu")) {
        const on = t.getAttribute("data-miyu") === "on";
        return deviceConfig({miyuEnabled: on}, (d)=>"密语已" + (d.miyuEnabled ? "开" : "关"));
      }
      if (t.id === "dc-vol-set") {
        const v = parseInt(($("dc-vol")||{}).value, 10);
        if (isNaN(v)) { toast("请输入 0-100 的音量", "err"); return; }
        return deviceConfig({volumePct: v}, (d)=>"音量已设为 " + (d.volumePct!=null ? d.volumePct : v) + "%");
      }
    });

    // ── user profile / memory (read-only, ADR-020/022) ────────────────────────
    async function loadMemory() {
      const host = $("memory"); if (!host) return;
      try {
        const r = await fetch("/v1/memory", {headers: {Accept: "application/json"}});
        const j = await r.json();
        if (!r.ok || !j.ok) throw new Error((j && j.detail) || ("HTTP " + r.status));
        const files = (j.data && j.data.files) || [];
        host.innerHTML = files.length
          ? files.map((f)=>`<div class="memfile"><div class="memname">${esc(f.name)}</div>
              <pre class="mempre">${esc((f.content||"").trim() || "（空）")}</pre></div>`).join("")
          : `<div class="sdesc">还没有记忆文件——管家初次对话后会逐步在 <span style="color:var(--dim)">${esc((j.data&&j.data.dir)||"workspace/MEMORY")}</span> 里积累。</div>`;
      } catch (e) {
        host.innerHTML = `<div class="error">加载记忆失败：${esc(e.message)}</div>`;
      }
    }

    // ── boot ───────────────────────────────────────────────────────────────────
    async function load() {
      try {
        const r = await fetch("/v1/settings", {headers: {Accept: "application/json"}});
        const j = await r.json();
        if (!r.ok || !j.ok) throw new Error((j && j.detail) || ("HTTP " + r.status));
        current = j.data;
        render(j.data);
      } catch (e) {
        $("content").innerHTML = `<div class="error">加载配置失败：${esc(e.message)}</div>`;
      }
    }
    load();
  })();
  </script>
</body>
</html>
